services:
  mysql:
    image: mysql:8.4
    container_name: foodmap-mysql
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: foodmap
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
      MYSQL_ROOT_PASSWORD: rootpw
      TZ: Asia/Seoul
    command: [
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_0900_ai_ci"
    ]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-prootpw"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db-data:
